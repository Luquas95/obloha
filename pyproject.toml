[project]
name = "obloha"
version = "0.1.0"
description = "Terminálové planetárium: co je právě teď na obloze nad tebou."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "obloha contributors" }]
keywords = ["astronomy", "planetarium", "tui", "textual", "skyfield"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.26",
    "skyfield>=1.49",
    "skyfield-data>=7.0",
    "textual>=1.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "tomlkit>=0.12",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
tz = ["timezonefinder>=6.5"]
web = ["textual-serve>=1.1"]
all = ["timezonefinder>=6.5", "textual-serve>=1.1"]

[project.scripts]
obloha = "obloha.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.23",
    "pytest-textual-snapshot>=1.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "timezonefinder>=6.5",
    "textual-serve>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obloha"]

[tool.hatch.build.targets.sdist]
include = ["src/obloha", "scripts", "tests", "docs", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "C4", "PIE", "RET"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N806"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/obloha"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["skyfield.*", "skyfield_data.*", "timezonefinder.*", "textual_serve.*", "jplephem.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
filterwarnings = ["ignore:Setting the dtype on a NumPy array:DeprecationWarning"]
markers = [
    "benchmark: performance tests",
    "ui: textual UI tests",
]

[tool.coverage.run]
source = ["obloha"]
branch = true
omit = ["src/obloha/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\.$"]
